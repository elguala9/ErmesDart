version: '3.8'

services:
  # EVM Ganache - Standalone Ethereum test network for integration tests
  ganache:
    image: trufflesuite/ganache:latest
    container_name: ermes-test-ganache
    ports:
      - "9545:8545"
    command:
      - --mnemonic=test test test test test test test test test test test junk
      - --accounts=20
      - --defaultBalanceEther=1000
      - --chain.chainId=1337
      - --hardfork=shanghai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
      - ermes-peers-network
    labels:
      description: "Ganache instance for Signaling Contract integration tests"

  # Signaling Contract Deployer - Deploys the Solidity contract to Ganache
  signaling-contract-deployer:
    image: elguala96/signaling-contract-deployer:v1.0.2
    container_name: ermes-test-contract-deployer
    depends_on:
      ganache:
        condition: service_started
    environment:
      RPC_URL: http://ganache:8545
    networks:
      - ermes-peers-network
    restart: "no"
    labels:
      description: "Deploys the Signaling Contract to Ganache (runs once then exits)"

  # STUN Server - coturn configured for STUN-only mode
  stun-server:
    image: coturn/coturn:latest
    container_name: ermes-test-stun-server
    ports:
      - "3478:3478/udp"
    networks:
      - ermes-peers-network
    command:
      - --no-auth
      - --listening-ip=0.0.0.0
      - --listening-port=3478
    restart: unless-stopped
    labels:
      description: "STUN server for NAT traversal testing"

  # Peer Alice - Test peer account 0
  peer-alice:
    build:
      context: .
      dockerfile: Dockerfile.peer
    container_name: ermes-test-peer-alice
    depends_on:
      ganache:
        condition: service_started
      stun-server:
        condition: service_started
      signaling-contract-deployer:
        condition: service_completed_successfully
    environment:
      MY_ADDRESS: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
      GANACHE_URL: "http://ganache:8545"
      CONTRACT_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      STUN_SERVER: "stun-server"
      STUN_PORT: "3478"
      CONFIG_PATH: "/app/config/test_config.json"
    volumes:
      - ./packages/ermes_peer_node/config:/app/config:ro
      - ./test_results:/app/results
    networks:
      - ermes-peers-network
    labels:
      description: "Test peer Alice - account 0"

  # Peer Bob - Test peer account 1
  peer-bob:
    build:
      context: .
      dockerfile: Dockerfile.peer
    container_name: ermes-test-peer-bob
    depends_on:
      ganache:
        condition: service_started
      stun-server:
        condition: service_started
      signaling-contract-deployer:
        condition: service_completed_successfully
    environment:
      MY_ADDRESS: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
      GANACHE_URL: "http://ganache:8545"
      CONTRACT_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      STUN_SERVER: "stun-server"
      STUN_PORT: "3478"
      CONFIG_PATH: "/app/config/test_config.json"
    volumes:
      - ./packages/ermes_peer_node/config:/app/config:ro
      - ./test_results:/app/results
    networks:
      - ermes-peers-network
    labels:
      description: "Test peer Bob - account 1"

  # Peer Charlie - Test peer account 2
  peer-charlie:
    build:
      context: .
      dockerfile: Dockerfile.peer
    container_name: ermes-test-peer-charlie
    depends_on:
      ganache:
        condition: service_started
      stun-server:
        condition: service_started
      signaling-contract-deployer:
        condition: service_completed_successfully
    environment:
      MY_ADDRESS: "0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC"
      GANACHE_URL: "http://ganache:8545"
      CONTRACT_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      STUN_SERVER: "stun-server"
      STUN_PORT: "3478"
      CONFIG_PATH: "/app/config/test_config.json"
    volumes:
      - ./packages/ermes_peer_node/config:/app/config:ro
      - ./test_results:/app/results
    networks:
      - ermes-peers-network
    labels:
      description: "Test peer Charlie - account 2"

  # Peer Dave - Test peer account 3
  peer-dave:
    build:
      context: .
      dockerfile: Dockerfile.peer
    container_name: ermes-test-peer-dave
    depends_on:
      ganache:
        condition: service_started
      stun-server:
        condition: service_started
      signaling-contract-deployer:
        condition: service_completed_successfully
    environment:
      MY_ADDRESS: "0x90F79bf6EB2c4f870365E785982E1f101E93b906"
      GANACHE_URL: "http://ganache:8545"
      CONTRACT_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      STUN_SERVER: "stun-server"
      STUN_PORT: "3478"
      CONFIG_PATH: "/app/config/test_config.json"
    volumes:
      - ./packages/ermes_peer_node/config:/app/config:ro
      - ./test_results:/app/results
    networks:
      - ermes-peers-network
    labels:
      description: "Test peer Dave - account 3"

networks:
  ermes-peers-network:
    driver: bridge
    name: ermes-peers-network
