version: '3.8'

# Symmetric NAT Test - Dual Router Topology
# zone-a ←→ router-a ←→ public-net ←→ router-b ←→ zone-b
#
# EXPECTED TO FAIL: Symmetric NAT randomizes port per destination,
# making STUN-discovered addresses useless for other peers.

services:
  ganache:
    image: trufflesuite/ganache:latest
    container_name: ermes-nat-symmetric-ganache
    command:
      - --mnemonic=test test test test test test test test test test test junk
      - --accounts=20
      - --defaultBalanceEther=1000
      - --chain.chainId=1337
      - --hardfork=shanghai
    restart: unless-stopped
    networks:
      public-net:
        ipv4_address: 172.31.0.10

  stun-server:
    image: coturn/coturn:latest
    container_name: ermes-nat-symmetric-stun
    networks:
      public-net:
        ipv4_address: 172.31.0.20
    command:
      - --no-auth
      - --listening-ip=0.0.0.0
      - --listening-port=3478
    restart: unless-stopped

  signaling-contract-deployer:
    image: elguala96/signaling-contract-deployer:v1.0.2
    container_name: ermes-nat-symmetric-deployer
    depends_on:
      ganache:
        condition: service_started
    environment:
      RPC_URL: http://ganache:8545
    networks:
      - public-net
    restart: "no"

  router-a:
    image: alpine:3.19
    container_name: ermes-nat-symmetric-router-a
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
    environment:
      ZONE_SUBNET: "172.31.10.0/24"
    volumes:
      - ./scripts/router-entrypoint-symmetric.sh:/router-entrypoint.sh:ro
    entrypoint: /router-entrypoint.sh
    networks:
      public-net:
        ipv4_address: 172.31.0.2
      zone-a-net:
        ipv4_address: 172.31.10.2

  router-b:
    image: alpine:3.19
    container_name: ermes-nat-symmetric-router-b
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
    environment:
      ZONE_SUBNET: "172.31.20.0/24"
    volumes:
      - ./scripts/router-entrypoint-symmetric.sh:/router-entrypoint.sh:ro
    entrypoint: /router-entrypoint.sh
    networks:
      public-net:
        ipv4_address: 172.31.0.3
      zone-b-net:
        ipv4_address: 172.31.20.2

  peer-alice:
    build:
      context: .
      dockerfile: Dockerfile.peer
    container_name: ermes-nat-symmetric-peer-alice
    cap_add:
      - NET_ADMIN
    depends_on:
      ganache:
        condition: service_started
      stun-server:
        condition: service_started
      router-a:
        condition: service_started
      signaling-contract-deployer:
        condition: service_completed_successfully
    environment:
      MY_ADDRESS: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
      GANACHE_URL: "http://172.31.0.10:8545"
      STUN_SERVER: "172.31.0.20"
      STUN_PORT: "3478"
      CONFIG_PATH: "/app/config/test_config_nat.json"
      DEFAULT_GATEWAY: "172.31.10.2"
      NETWORK_LATENCY_MS: "50"
      NETWORK_JITTER_MS: "10"
    volumes:
      - ./packages/ermes_peer_node/config:/app/config:ro
      - ./test_results:/app/results
    networks:
      zone-a-net:
        ipv4_address: 172.31.10.11

  peer-bob:
    build:
      context: .
      dockerfile: Dockerfile.peer
    container_name: ermes-nat-symmetric-peer-bob
    cap_add:
      - NET_ADMIN
    depends_on:
      ganache:
        condition: service_started
      stun-server:
        condition: service_started
      router-b:
        condition: service_started
      signaling-contract-deployer:
        condition: service_completed_successfully
    environment:
      MY_ADDRESS: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
      GANACHE_URL: "http://172.31.0.10:8545"
      STUN_SERVER: "172.31.0.20"
      STUN_PORT: "3478"
      CONFIG_PATH: "/app/config/test_config_nat.json"
      DEFAULT_GATEWAY: "172.31.20.2"
      NETWORK_LATENCY_MS: "50"
      NETWORK_JITTER_MS: "10"
    volumes:
      - ./packages/ermes_peer_node/config:/app/config:ro
      - ./test_results:/app/results
    networks:
      zone-b-net:
        ipv4_address: 172.31.20.11

  peer-charlie:
    build:
      context: .
      dockerfile: Dockerfile.peer
    container_name: ermes-nat-symmetric-peer-charlie
    cap_add:
      - NET_ADMIN
    depends_on:
      ganache:
        condition: service_started
      stun-server:
        condition: service_started
      router-a:
        condition: service_started
      signaling-contract-deployer:
        condition: service_completed_successfully
    environment:
      MY_ADDRESS: "0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC"
      GANACHE_URL: "http://172.31.0.10:8545"
      STUN_SERVER: "172.31.0.20"
      STUN_PORT: "3478"
      CONFIG_PATH: "/app/config/test_config_nat.json"
      DEFAULT_GATEWAY: "172.31.10.2"
      NETWORK_LATENCY_MS: "50"
      NETWORK_JITTER_MS: "10"
    volumes:
      - ./packages/ermes_peer_node/config:/app/config:ro
      - ./test_results:/app/results
    networks:
      zone-a-net:
        ipv4_address: 172.31.10.12

  peer-dave:
    build:
      context: .
      dockerfile: Dockerfile.peer
    container_name: ermes-nat-symmetric-peer-dave
    cap_add:
      - NET_ADMIN
    depends_on:
      ganache:
        condition: service_started
      stun-server:
        condition: service_started
      router-b:
        condition: service_started
      signaling-contract-deployer:
        condition: service_completed_successfully
    environment:
      MY_ADDRESS: "0x90F79bf6EB2c4f870365E785982E1f101E93b906"
      GANACHE_URL: "http://172.31.0.10:8545"
      STUN_SERVER: "172.31.0.20"
      STUN_PORT: "3478"
      CONFIG_PATH: "/app/config/test_config_nat.json"
      DEFAULT_GATEWAY: "172.31.20.2"
      NETWORK_LATENCY_MS: "50"
      NETWORK_JITTER_MS: "10"
    volumes:
      - ./packages/ermes_peer_node/config:/app/config:ro
      - ./test_results:/app/results
    networks:
      zone-b-net:
        ipv4_address: 172.31.20.12

networks:
  public-net:
    driver: bridge
    name: ermes-nat-symmetric-public
    ipam:
      config:
        - subnet: 172.31.0.0/24

  zone-a-net:
    driver: bridge
    name: ermes-nat-symmetric-zone-a
    ipam:
      config:
        - subnet: 172.31.10.0/24

  zone-b-net:
    driver: bridge
    name: ermes-nat-symmetric-zone-b
    ipam:
      config:
        - subnet: 172.31.20.0/24
