version: '3.8'

services:
  # EVM Ganache - Standalone Ethereum test network for integration tests
  ganache:
    image: trufflesuite/ganache:latest
    container_name: parresia-contract-ganache
    ports:
      - "9545:8545"
    command:
      - --mnemonic=test test test test test test test test test test test junk
      - --accounts=20
      - --defaultBalanceEther=1000
      - --chain.chainId=1337
      - --hardfork=shanghai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
      - contract-ermes-network
    labels:
      description: "Ganache instance for Signaling Contract integration tests"

  # Signaling Contract Deployer - Deploys the Solidity contract to Ganache
  signaling-contract-deployer:
    image: elguala96/signaling-contract-deployer:v1.0.2
    container_name: parresia-contract-deployer
    depends_on:
      ganache:
        condition: service_started
    environment:
      RPC_URL: http://ganache:8545
      # NOTE: PRIVATE_KEY not needed - uses hardhat config mnemonic fallback
    networks:
      - contract-ermes-network
    restart: "no"
    labels:
      description: "Deploys the Signaling Contract to Ganache (runs once then exits)"

networks:
  contract-ermes-network:
    driver: bridge
    name: parresia-ermes-network
