version: '3.8'

services:
  # EVM Ganache - Standalone Ethereum test network for integration tests
  ganache:
    image: trufflesuite/ganache:latest
    container_name: ermes-nat-symmetric-ganache
    ports:
      - "9545:8545"
    command:
      - --mnemonic=test test test test test test test test test test test junk
      - --accounts=20
      - --defaultBalanceEther=1000
      - --chain.chainId=1337
      - --hardfork=shanghai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
      public-net:
        ipv4_address: 172.30.0.10
    labels:
      description: "Ganache instance on public network"

  # STUN Server - coturn configured for STUN-only mode (on public network)
  stun-server:
    image: coturn/coturn:latest
    container_name: ermes-nat-symmetric-stun-server
    ports:
      - "3478:3478/udp"
    networks:
      public-net:
        ipv4_address: 172.30.0.20
    command:
      - --no-auth
      - --listening-ip=0.0.0.0
      - --listening-port=3478
    restart: unless-stopped
    labels:
      description: "STUN server on public network for NAT traversal testing"

  # Signaling Contract Deployer - Deploys the Solidity contract to Ganache
  signaling-contract-deployer:
    image: elguala96/signaling-contract-deployer:v1.0.2
    container_name: ermes-nat-symmetric-contract-deployer
    depends_on:
      ganache:
        condition: service_started
    environment:
      RPC_URL: http://ganache:8545
    networks:
      - public-net
    restart: "no"
    labels:
      description: "Deploys the Signaling Contract to Ganache (runs once then exits)"

  # NAT Router - Simulates Symmetric NAT using iptables MASQUERADE --random
  # This randomizes the ephemeral source port for each connection, making
  # STUN-discovered endpoints unreliable for peer connectivity (the port changes
  # depending on the destination peer).
  router:
    image: alpine:3.19
    container_name: ermes-nat-symmetric-router
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
    volumes:
      - ./scripts/router-entrypoint-symmetric.sh:/router-entrypoint.sh:ro
    entrypoint: /router-entrypoint.sh
    networks:
      public-net:
        ipv4_address: 172.30.0.1
      zone-a-net:
        ipv4_address: 172.30.10.1
      zone-b-net:
        ipv4_address: 172.30.20.1
    labels:
      description: "Symmetric NAT router with --random port randomization"

  # Pumba - Chaos engineering tool for Docker containers
  # Injects additional latency, jitter, and packet loss on top of tc netem
  # to simulate realistic network conditions (external chaos, not internal)
  pumba:
    image: gaiaadm/pumba:latest
    container_name: ermes-nat-symmetric-pumba
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: |
      netem --tc-image gaiaadm/tc:latest
      --duration 300s
      delay --time 30 --jitter 10 --distribution normal
      loss --percent 2
      re2:ermes-nat-symmetric-peer-.*
    networks:
      - public-net
    depends_on:
      - peer-alice
      - peer-bob
      - peer-charlie
      - peer-dave
    labels:
      description: "Chaos engineering: external latency/loss injection on peer containers"

  # Peer Alice - Zone A (behind Symmetric NAT)
  peer-alice:
    build:
      context: .
      dockerfile: Dockerfile.peer
    container_name: ermes-nat-symmetric-peer-alice
    cap_add:
      - NET_ADMIN
    depends_on:
      ganache:
        condition: service_started
      stun-server:
        condition: service_started
    environment:
      MY_ADDRESS: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
      GANACHE_URL: "http://172.30.0.10:8545"
      CONTRACT_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      STUN_SERVER: "172.30.0.20"
      STUN_PORT: "3478"
      CONFIG_PATH: "/app/config/test_config_nat_symmetric.json"
      NETWORK_LATENCY_MS: "50"
      NETWORK_JITTER_MS: "10"
    volumes:
      - ./packages/ermes_peer_node/config:/app/config:ro
      - ./test_results:/app/results
    networks:
      zone-a-net:
        ipv4_address: 172.30.10.11
    labels:
      description: "Test peer Alice in Zone A (behind Symmetric NAT)"

  # Peer Bob - Zone B (behind Symmetric NAT)
  peer-bob:
    build:
      context: .
      dockerfile: Dockerfile.peer
    container_name: ermes-nat-symmetric-peer-bob
    cap_add:
      - NET_ADMIN
    depends_on:
      ganache:
        condition: service_started
      stun-server:
        condition: service_started
    environment:
      MY_ADDRESS: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
      GANACHE_URL: "http://172.30.0.10:8545"
      CONTRACT_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      STUN_SERVER: "172.30.0.20"
      STUN_PORT: "3478"
      CONFIG_PATH: "/app/config/test_config_nat_symmetric.json"
      NETWORK_LATENCY_MS: "50"
      NETWORK_JITTER_MS: "10"
    volumes:
      - ./packages/ermes_peer_node/config:/app/config:ro
      - ./test_results:/app/results
    networks:
      zone-b-net:
        ipv4_address: 172.30.20.11
    labels:
      description: "Test peer Bob in Zone B (behind Symmetric NAT)"

  # Peer Charlie - Zone A (behind Symmetric NAT)
  peer-charlie:
    build:
      context: .
      dockerfile: Dockerfile.peer
    container_name: ermes-nat-symmetric-peer-charlie
    cap_add:
      - NET_ADMIN
    depends_on:
      ganache:
        condition: service_started
      stun-server:
        condition: service_started
    environment:
      MY_ADDRESS: "0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC"
      GANACHE_URL: "http://172.30.0.10:8545"
      CONTRACT_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      STUN_SERVER: "172.30.0.20"
      STUN_PORT: "3478"
      CONFIG_PATH: "/app/config/test_config_nat_symmetric.json"
      NETWORK_LATENCY_MS: "50"
      NETWORK_JITTER_MS: "10"
    volumes:
      - ./packages/ermes_peer_node/config:/app/config:ro
      - ./test_results:/app/results
    networks:
      zone-a-net:
        ipv4_address: 172.30.10.12
    labels:
      description: "Test peer Charlie in Zone A (behind Symmetric NAT)"

  # Peer Dave - Zone B (behind Symmetric NAT)
  peer-dave:
    build:
      context: .
      dockerfile: Dockerfile.peer
    container_name: ermes-nat-symmetric-peer-dave
    cap_add:
      - NET_ADMIN
    depends_on:
      ganache:
        condition: service_started
      stun-server:
        condition: service_started
    environment:
      MY_ADDRESS: "0x90F79bf6EB2c4f870365E785982E1f101E93b906"
      GANACHE_URL: "http://172.30.0.10:8545"
      CONTRACT_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      STUN_SERVER: "172.30.0.20"
      STUN_PORT: "3478"
      CONFIG_PATH: "/app/config/test_config_nat_symmetric.json"
      NETWORK_LATENCY_MS: "50"
      NETWORK_JITTER_MS: "10"
    volumes:
      - ./packages/ermes_peer_node/config:/app/config:ro
      - ./test_results:/app/results
    networks:
      zone-b-net:
        ipv4_address: 172.30.20.12
    labels:
      description: "Test peer Dave in Zone B (behind Symmetric NAT)"

networks:
  public-net:
    driver: bridge
    name: ermes-nat-symmetric-public-net
    ipam:
      config:
        - subnet: 172.30.0.0/24

  zone-a-net:
    driver: bridge
    name: ermes-nat-symmetric-zone-a
    ipam:
      config:
        - subnet: 172.30.10.0/24

  zone-b-net:
    driver: bridge
    name: ermes-nat-symmetric-zone-b
    ipam:
      config:
        - subnet: 172.30.20.0/24
