
name: ermes_dart_workspace
description: Ermes Dart monorepo workspace
publish_to: none

workspace:
  - packages/iermes
  - packages/ermes_core
  - packages/ermes_cipher
  - packages/ermes_storage
  - packages/ermes_signaling
  - packages/ermes_id_handler
  - packages/ermes_message_control
  - packages/ermes_core_init
  - packages/ermes_test
  - packages/ermes_test_docker
  - packages/ermes_test_shared
  - packages/ermes_test_pc
  - packages/ermes_test_actions
  - packages/ermes_test_with_mock

environment:
  sdk: ">=3.9.4 <5.0.0"

dependency_overrides:
  shsp:
    path: ../SingleHandShakeProtocolDart/packages/shsp
  stun:
    path: ../StunDart/packages/stun
  stun_shsp:
    path: ../StunShspDart/packages/stun_shsp
  nostr_signaling:
    path: ../NostrSignaling/packages/nostr_signaling
  # Remove once callback_handler 0.0.4 is published on pub.dev.
  callback_handler:
    path: ../CallbackHandlerDart/packages/callback_handler
  # TODO: Remove once bip39 (dep of dart_nostr) supports pointycastle >=4.0.0
  #       See TODO_Version_issue.md for details
  pointycastle: 4.0.0

dev_dependencies:
  melos: ^7.3.0

# Melos configuration for workspace
melos:
  command:
    bootstrap:
      environment:
        sdk: ">=3.2.0 <4.0.0"
      
    version:
      # Only allow versioning to happen on main branch.
      branch: main
      # Generate commit links in package changelogs.
      linkToCommits: false
      # Changelog formatting.
      message: "chore(release): publish packages"

  scripts:
    # Analyze all packages
    analyze:
      run: melos exec -- dart analyze .
      description: Run Dart analyzer in all packages.
      
    # Analyze all packages with detailed output
    analyze:all:
      run: melos exec --scope="types,iermes,ermes,ermes_storage,ermes_signaling,ermes_test" -- dart analyze . --fatal-infos
      description: Analyze all packages with detailed output.
      
    # Format all packages
    format:
      run: melos exec -- dart format .
      description: Format all Dart files.
      
    # === TEST COMMANDS ===
    
    # Run all tests
    test:
      run: melos exec --fail-fast -- dart test --color
      description: Run all tests in packages that have them.
      packageFilters:
        dirExists: test

    # Run only interface compliance tests
    test:interfaces:
      run: melos exec --fail-fast -- dart test --name "*Interface*" --color
      description: Run interface compliance tests only.
      packageFilters:
        dirExists: test

    # Run tests in specific packages
    test:signaling:
      run: melos exec --fail-fast --scope="ermes_signaling" -- dart test --color
      description: Run tests in ermes_signaling package only.

    test:types:
      run: melos exec --fail-fast --scope="types" -- dart test --color
      description: Run tests in types package only.

    test:testing:
      run: melos exec --fail-fast --scope="ermes_test" -- dart test --color
      description: Run tests in ermes_test package only.

    # Run all tests (Dart + Docker)
    test:all:
      run: melos run test; melos run test:docker
      description: Run all tests (Dart unit tests + Docker integration).

    # Run Docker integration tests
    test:docker:
      run: bash scripts/test-all-nat-types.sh
      description: Run Docker integration tests (requires Docker + bash).

    # Run tests with coverage
    test:coverage:
      run: melos exec --fail-fast -- dart test --coverage=coverage --color
      description: Run tests with coverage collection.
      packageFilters:
        dirExists: test

    # === COVERAGE COMMANDS ===

    # Generate coverage report
    coverage:
      run: |
        echo "📊 Generating code coverage..."
        dart test packages/ermes_test/test/ --coverage=coverage
        echo "🔄 Converting coverage data to LCOV format..."
        dart pub global activate coverage
        dart pub global run coverage:format_coverage --in=coverage --out=coverage/lcov.info --lcov --report-on=packages/ermes_core/lib,packages/ermes_signaling/lib,packages/ermes_cipher/lib
        echo "✅ Coverage report generated at coverage/lcov.info"
      description: Generate code coverage report and save to coverage/lcov.info

    # Show coverage report with details
    coverage:report:
      run: dart run tool/coverage_report.dart --untested
      description: Show detailed coverage report with untested line numbers.

    # Show coverage summary
    coverage:report:summary:
      run: dart run tool/coverage_report.dart
      description: Show coverage summary (without untested line details).

    # Run tests in verbose mode
    test:verbose:
      run: melos exec --fail-fast -- dart test --reporter=expanded --color
      description: Run tests with verbose output.
      packageFilters:
        dirExists: test

    # Run specific test files
    test:file:
      run: melos exec --fail-fast -- dart test --color
      description: Run specific test files. Use with --scope and file path.
      
    # === DEVELOPMENT COMMANDS ===
      
    # Check formatting
    format:check:
      run: melos exec -- dart format --set-exit-if-changed .
      description: Check formatting in all packages.
      
    # Get dependencies for all packages
    get:
      run: melos exec -- dart pub get
      description: Get dependencies for all packages.
      
    # Clean all packages
    clean:
      run: melos exec -- rm -rf build coverage .dart_tool
      description: Clean all packages.
      
    # Generate barrel files for all packages
    barrels:
      run: melos exec --ignore=ermes_test -- dart pub run index_generator
      description: Generate barrel files (indexes) for all packages using index_generator.

    # Regenerate the in-class dependencyInjectionFactory constructors.
    #
    # --registry-output is deliberately NOT used: the generator only imports the
    # implementation files it discovered, so the registry file it emits cannot
    # see the interfaces, which live in package:iermes. Each package therefore
    # hand-maintains its own lib/src/main_injection.dart.
    #
    # Each package is generated by its own dedicated script, with the rewritten
    # files written to that package's `generated/` folder (via --output)
    # instead of overwriting the sources under lib/ in place.
    singleton_generator:ermes_cipher:
      run: melos exec --scope="ermes_cipher" -- dart run singleton_manager_generator --input lib --output generated
      description: Regenerate the dependencyInjectionFactory constructors for ermes_cipher into generated/.

    singleton_generator:ermes_core:
      run: melos exec --scope="ermes_core" -- dart run singleton_manager_generator --input lib --output generated
      description: Regenerate the dependencyInjectionFactory constructors for ermes_core into generated/.

    singleton_generator:ermes_id_handler:
      run: melos exec --scope="ermes_id_handler" -- dart run singleton_manager_generator --input lib --output generated
      description: Regenerate the dependencyInjectionFactory constructors for ermes_id_handler into generated/.

    singleton_generator:ermes_message_control:
      run: melos exec --scope="ermes_message_control" -- dart run singleton_manager_generator --input lib --output generated
      description: Regenerate the dependencyInjectionFactory constructors for ermes_message_control into generated/.

    singleton_generator:ermes_signaling:
      run: melos exec --scope="ermes_signaling" -- dart run singleton_manager_generator --input lib --output generated
      description: Regenerate the dependencyInjectionFactory constructors for ermes_signaling into generated/.

    singleton_generator:
      run: melos run singleton_generator:ermes_cipher && melos run singleton_generator:ermes_core && melos run singleton_generator:ermes_id_handler && melos run singleton_generator:ermes_message_control && melos run singleton_generator:ermes_signaling
      description: Regenerate the dependencyInjectionFactory constructors in every package that uses dependency injection, running one package at a time.

    # Complete CI pipeline
    ci:
      run: melos clean && melos get && melos analyze && melos format:check && melos test
      description: Run complete CI pipeline (clean, get, analyze, format check, test).
      
    # Quick development check
    check:
      run: melos analyze && melos test:interfaces
      description: Quick check for development (analyze + interface tests).

    # === NAT TEST (GitHub Actions) ===

    # Drive the GitHub Actions NAT test end-to-end
    nat:run:
      run: dart run packages/ermes_test_actions/bin/nat_run.dart
      description: Push to the nat-test branch and drive the GitHub Actions NAT test end-to-end (push, watch, download logs, PASS/FAIL).

    # Run ONE side of the NAT test locally, to pair with the other side on
    # GitHub Actions (run the workflow with side=a-only, then `melos nat:local:b`
    # here; or side=b-only + `melos nat:local:a`). Rendezvous is over public
    # Nostr relays + STUN, so the local peer (home/ISP NAT) and the Actions
    # peer (Azure NAT) get genuinely different public IPs. Dials are
    # window-synchronized via the signal interval, so start order is free.
    # Prereq: workspace bootstrapped (the shsp sibling checkout must exist;
    # see dependency_overrides). Identities match .github/workflows/nat-test.yml
    # (throwaway test keys — NOT real).
    nat:local:a:
      run: dart run packages/ermes_test_shared/bin/nat_peer_a.dart
      description: Run NAT-test peer A (initiator) locally; pair with the Actions run using side=b-only.
      env:
        STUN_HOST: stun.l.google.com
        STUN_PORT: "19302"
        NOSTR_RELAYS: "wss://nos.lol,wss://relay.damus.io,wss://nostr-pub.wellorder.net,wss://relay.primal.net"
        ALICE_PUBKEY: b92ad53e9350444f5572b4ffdc51a9839161729b0f5a62e68a3694c78d3dc4c5
        BOB_PUBKEY: 40f72d5b56f8fcda629d4fd9e046038480cc71aaee01b3a2fc524aba6803dcac
        NOSTR_PUBKEY: b92ad53e9350444f5572b4ffdc51a9839161729b0f5a62e68a3694c78d3dc4c5
        NOSTR_PRIVKEY: baeed075852a757626e2bae3220c915ec43bcdc81343f83b0f50e3a933063d6c
        ACCOUNT_ID: b92ad53e9350444f5572b4ffdc51a9839161729b0f5a62e68a3694c78d3dc4c5

    nat:local:b:
      run: dart run packages/ermes_test_shared/bin/nat_peer_b.dart
      description: Run NAT-test peer B (responder) locally; pair with the Actions run using side=a-only.
      env:
        STUN_HOST: stun.l.google.com
        STUN_PORT: "19302"
        NOSTR_RELAYS: "wss://nos.lol,wss://relay.damus.io,wss://nostr-pub.wellorder.net,wss://relay.primal.net"
        ALICE_PUBKEY: b92ad53e9350444f5572b4ffdc51a9839161729b0f5a62e68a3694c78d3dc4c5
        BOB_PUBKEY: 40f72d5b56f8fcda629d4fd9e046038480cc71aaee01b3a2fc524aba6803dcac
        NOSTR_PUBKEY: 40f72d5b56f8fcda629d4fd9e046038480cc71aaee01b3a2fc524aba6803dcac
        NOSTR_PRIVKEY: 187f26af502a4b1dff9c80ab7798ffaace92c3db4ce85301300558ae02a3310e
        ACCOUNT_ID: 40f72d5b56f8fcda629d4fd9e046038480cc71aaee01b3a2fc524aba6803dcac

    # === NAT TEST (GitHub Actions scenario drivers) ===
    # Each driver dispatches peer-b (responder) on a GitHub runner and runs
    # peer-a (initiator) locally with the matching NAT_SCENARIO, then reports the
    # local PASS/FAIL (confirm peer-b on GitHub). Requires `gh` (authenticated)
    # and the Dart SDK; sh comes from Git Bash on Windows. See
    # scripts/lib/github-nat-driver.sh for env overrides.

    # Run every scenario in sequence and summarise which failed (with error
    # tails). Long: the full set includes long-outage (>10 min) — pass a subset
    # as args while iterating, e.g. `melos test:github:all -- encrypted rekey`.
    test:github:all:
      run: sh scripts/run-test-github-all.sh
      description: Run every GitHub Actions NAT scenario in sequence; summarise PASS/FAIL with error tails.

    # Same scenarios, same sequential order, but each one dispatches its OWN
    # per-scenario workflow (.github/workflows/nat-<scenario>.yml) so every
    # functionality shows up as its own Action (own name + badge + history).
    # A failing scenario is isolated and does not taint the others' status.
    test:github:all:onebyone:
      run: sh scripts/run-test-github-all-onebyone.sh
      description: Run every GitHub Actions NAT scenario, each on its own per-scenario workflow (isolated Action per functionality).

    # Run only the P1 reconnection family (graceful-reconnect, peer-restart,
    # flap, flap-storm, long-outage). Pass a subset as args while iterating,
    # e.g. `melos test:github:p1 -- flap flap-storm`. Long: includes long-outage.
    test:github:p1:
      run: sh scripts/run-test-github-p1.sh
      description: Run the P1 reconnection-family GitHub Actions NAT scenarios in sequence; summarise PASS/FAIL.

    # Fast P1 subset for iteration: every P1 scenario EXCEPT long-outage (>10 min).
    test:github:p1:fast:
      run: sh scripts/run-test-github-p1-fast.sh
      description: Run the fast P1 subset (graceful-reconnect, peer-restart, flap, flap-storm) — excludes long-outage.

    # Run only the P3 encryption family (encrypted, rekey). Pass a subset as
    # args while iterating, e.g. `melos test:github:p3 -- encrypted`.
    test:github:p3:
      run: sh scripts/run-test-github-p3.sh
      description: Run the P3 encryption-family GitHub Actions NAT scenarios in sequence; summarise PASS/FAIL.

    test:github:encrypted:
      run: sh scripts/run-test-github-encrypted.sh
      description: P3 encrypted (ECDH + AES). Run this first — it is the local<->Azure traversal smoke test.

    test:github:rekey:
      run: sh scripts/run-test-github-rekey.sh
      description: P3 rekey — mid-session symmetric-key rotation over the encrypted link.

    test:github:graceful-reconnect:
      run: sh scripts/run-test-github-graceful-reconnect.sh
      description: P1 graceful-reconnect — the local peer closes its link and the core re-rendezvous.

    test:github:peer-restart:
      run: sh scripts/run-test-github-peer-restart.sh
      description: P1 peer-restart — the driver hard-kills and relaunches the local peer (RESTART_AFTER).

    test:github:flap:
      run: sh scripts/run-test-github-flap.sh
      description: P1 flap — sub-threshold local pause; the link must NOT tear down and must NOT reconnect.

    test:github:flap-storm:
      run: sh scripts/run-test-github-flap-storm.sh
      description: P1 flap-storm — repeated break/reconnect cycles (FLAP_CYCLES overridable).

    test:github:long-outage:
      run: sh scripts/run-test-github-long-outage.sh
      description: P1 long-outage — outage >10 min; raise the runner job timeout via TIMEOUT_MINUTES.

    # Run only the P2 message-reliability family (lossless-reconnect,
    # fragmented-break, gap-detection). Pass a subset as args while iterating.
    test:github:p2:
      run: sh scripts/run-test-github-p2.sh
      description: Run the P2 reliability-family GitHub Actions NAT scenarios in sequence; summarise PASS/FAIL.

    test:github:lossless-reconnect:
      run: sh scripts/run-test-github-lossless-reconnect.sh
      description: P2 lossless-reconnect — keep sending through an in-process outage; every seq arrives in order.

    test:github:fragmented-break:
      run: sh scripts/run-test-github-fragmented-break.sh
      description: P2 fragmented-break — multi-MB payload, link broken mid-stream; checksum must match (FRAGMENT_BYTES).

    test:github:gap-detection:
      run: sh scripts/run-test-github-gap-detection.sh
      description: P2 gap-detection — withhold targeted seqs; receiver requests the exact missing IDs, only those resent.

    # Run only the P4 load / stress family (throughput, large-payload, keepalive).
    test:github:p4:
      run: sh scripts/run-test-github-p4.sh
      description: Run the P4 load-family GitHub Actions NAT scenarios in sequence; summarise PASS/FAIL.

    test:github:throughput:
      run: sh scripts/run-test-github-throughput.sh
      description: P4 throughput — sustain TARGET_RATE msg/s for DURATION; report achieved rate + p50/p99 + loss.

    test:github:large-payload:
      run: sh scripts/run-test-github-large-payload.sh
      description: P4 large-payload — sweep SIZES; checksum each reassembled payload, track max latency.

    test:github:keepalive:
      run: sh scripts/run-test-github-keepalive.sh
      description: P4 keepalive — idle IDLE_DURATION then resume without a full re-rendezvous (mapping held).

    # Run only the P5 adverse-condition family (lossy, latency-jitter, mtu-edge).
    # The workflow degrades the runner peer-b (tc netem / ip link set mtu).
    test:github:p5:
      run: sh scripts/run-test-github-p5.sh
      description: Run the P5 adverse-condition GitHub Actions NAT scenarios in sequence; summarise PASS/FAIL.

    test:github:lossy:
      run: sh scripts/run-test-github-lossy.sh
      description: P5 lossy — runner peer-b behind tc netem loss LOSS_PCT%; delivery still completes via retransmission.

    test:github:latency-jitter:
      run: sh scripts/run-test-github-latency-jitter.sh
      description: P5 latency-jitter — runner peer-b behind tc netem delay/jitter; no false disconnect, no duplicates.

    test:github:mtu-edge:
      run: sh scripts/run-test-github-mtu-edge.sh
      description: P5 mtu-edge — runner peer-b MTU constrained; reassembly correct, no oversized-datagram loss.

    # === NAT TEST (single peer from the published Quay.io image) ===

    # Run ONE peer of the NAT test via the download-and-go wrapper
    # scripts/run-nat-test-pc.sh, which pulls the published image and runs it with
    # --init (so Ctrl+C stops it cleanly) on the auto-detected container engine
    # (podman or docker). The SAME command works on Fedora and Windows:
    #   - Fedora: `sh` is native; podman/docker auto-detected; --network host
    #     is fully effective.
    #   - Windows: run melos from Git Bash so `sh` is on PATH; Docker Desktop
    #     adds a VM NAT layer (the test still runs, see the script's NOTE).
    # Pair role `a` on one network with role `b` on another while both run.
    # Override the image with ERMES_NAT_IMAGE; any NOSTR_*/STUN_* env var is
    # forwarded into the container.
    nat:image:a:
      run: sh scripts/run-nat-test-pc.sh a
      description: Run NAT-test peer A (initiator) from the published Quay image. Fedora & Windows (Git Bash needed on Windows).

    nat:image:b:
      run: sh scripts/run-nat-test-pc.sh b
      description: Run NAT-test peer B (responder) from the published Quay image. Fedora & Windows (Git Bash needed on Windows).

    # Build both NAT-test peers locally from Dockerfile.nat and run them with
    # podman compose. Verifies the test end-to-end without pulling an image.
    # Exits 0 on PASS (both peers print RESULT: PASS), non-zero on any failure.
    nat:compose:build:
      run: podman build -f packages/ermes_test_pc/docker/Dockerfile.nat -t localhost/ermes-nat-test:local . && podman-compose -f docker-compose.nat.build.yml up --abort-on-container-exit
      description: Build the NAT-test image locally (podman build) and run both peers with podman-compose (PASS/FAIL).

    # Pull the published NAT-test image from Quay.io and run both peers with
    # podman-compose. Override the image/tag via ERMES_NAT_IMAGE.
    nat:compose:quay:
      run: podman-compose -f docker-compose.nat.quay.yml up --abort-on-container-exit
      description: Pull the NAT-test image from Quay.io and run both peers with podman-compose (PASS/FAIL).

    # === NAT TEST (network-change scenario) ============================
    # Two ways to exercise the live-reconnection-after-a-network-change path
    # (steady heartbeat -> link dies -> core re-rendezvous -> exchange resumes):

    # (1) AUTOMATED, via Podman: builds the image locally (so it carries the
    # network-change heartbeat engines) and drives the whole test — bring up
    # both peers, wait for the steady exchange, swap peer-b's network, flush
    # conntrack, assert the exchange resumes (PASS/FAIL). The image gets the
    # localhost/ prefix Podman needs for an unqualified local name.
    # Faithful on Linux bare-metal or inside a WSL2 distro; on Podman machine
    # (Windows/macOS) it runs but the VM NAT masks the change (driver warns).
    netchange:podman:
      run: |
        podman build -f packages/ermes_test_pc/docker/Dockerfile.nat -t localhost/ermes-nat-test:netchange .
        ERMES_NAT_IMAGE=localhost/ermes-nat-test:netchange ERMES_NAT_ENGINE=podman sh scripts/run-net-change-test-compose.sh
      description: Build with Podman and run the automated network-change (NAT mapping swap) reconnection test end-to-end (PASS/FAIL).

    # (2) DIRECT ON THE PC: runs the moving peer NATIVELY (no container) in
    # network-change mode. Pair it with the stable peer elsewhere (a second
    # machine, or GitHub Actions via `melos nat:run` with side=b-only), then
    # trigger a REAL network change by hand while it runs, e.g.:
    #   sudo ip route replace default via <gw> dev <iface>   # WiFi -> tethering
    #   nmcli con down <wifi>; nmcli con up <tethering>
    # The peer detects the drop, re-rendezvous, and prints RECONNECT METRICS
    # (reconnect time + messages lost). Throwaway test identity (role a).
    netchange:pc:
      run: dart run packages/ermes_test_shared/bin/nat_peer_a.dart
      description: Run the moving peer natively on this PC in network-change mode; trigger a real network change by hand and watch it re-rendezvous (pair the stable side on another machine / Actions).
      env:
        NAT_SCENARIO: network-change
        STUN_HOST: stun.l.google.com
        STUN_PORT: "19302"
        NOSTR_RELAYS: "wss://nos.lol,wss://relay.damus.io,wss://nostr-pub.wellorder.net,wss://relay.primal.net"
        ALICE_PUBKEY: b92ad53e9350444f5572b4ffdc51a9839161729b0f5a62e68a3694c78d3dc4c5
        BOB_PUBKEY: 40f72d5b56f8fcda629d4fd9e046038480cc71aaee01b3a2fc524aba6803dcac
        NOSTR_PUBKEY: b92ad53e9350444f5572b4ffdc51a9839161729b0f5a62e68a3694c78d3dc4c5
        NOSTR_PRIVKEY: baeed075852a757626e2bae3220c915ec43bcdc81343f83b0f50e3a933063d6c
        ACCOUNT_ID: b92ad53e9350444f5572b4ffdc51a9839161729b0f5a62e68a3694c78d3dc4c5

    # Publish the NAT-test Docker image: force-push the current commit to the
    # publish-nat-image branch, triggering the Quay.io build on GitHub
    # Actions. The git remote is auto-detected (upstream of the current branch,
    # else origin, else the only remote); override with an argument or
    # ERMES_REMOTE. Same on Windows and Linux.
    publish:quay:
      run: dart run scripts/publish_nat.dart
      description: Force-push the current commit to the publish-nat-image branch, triggering the Quay.io image build (auto-detects the git remote).

    diagrams:
      run: diagram_generator --input . --output-dir ./diagrams --prefix ermes --verbose --per-package --no-methods --layout sfdp dot
      description: Generate architecture diagrams for the workspace.

    # Generate diagrams
    diagrams-implements:
      run: diagram_generator --input . --output-dir ./diagrams/implements --prefix ermes --verbose --per-package --no-methods --layout sfdp dot --only-relations implements  
      description: Generate architecture diagrams for the workspace.