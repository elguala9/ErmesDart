
name: ermes_dart_workspace
description: Ermes Dart monorepo workspace
publish_to: none

workspace:
  - packages/iermes
  - packages/ermes_core
  - packages/ermes_cipher
  - packages/ermes_storage
  - packages/ermes_signaling
  - packages/ermes_id_handler
  - packages/ermes_message_control
  - packages/ermes_core_init
  - packages/ermes_test
  - packages/ermes_test_docker

environment:
  sdk: ">=3.9.4 <5.0.0"

dependency_overrides:
  shsp:
    path: ../SingleHandShakeProtocolDart/packages/shsp

dev_dependencies:
  melos: ^7.3.0

# Melos configuration for workspace
melos:
  command:
    bootstrap:
      environment:
        sdk: ">=3.2.0 <4.0.0"
      
    version:
      # Only allow versioning to happen on main branch.
      branch: main
      # Generate commit links in package changelogs.
      linkToCommits: false
      # Changelog formatting.
      message: "chore(release): publish packages"

  scripts:
    # Analyze all packages
    analyze:
      run: melos exec -- dart analyze .
      description: Run Dart analyzer in all packages.
      
    # Analyze all packages with detailed output
    analyze:all:
      run: melos exec --scope="types,iermes,ermes,ermes_storage,ermes_signaling,ermes_test" -- dart analyze . --fatal-infos
      description: Analyze all packages with detailed output.
      
    # Format all packages
    format:
      run: melos exec -- dart format .
      description: Format all Dart files.
      
    # === TEST COMMANDS ===
    
    # Run all tests
    test:
      run: melos exec --fail-fast -- dart test --color
      description: Run all tests in packages that have them.
      packageFilters:
        dirExists: test

    # Run only interface compliance tests
    test:interfaces:
      run: melos exec --fail-fast -- dart test --name "*Interface*" --color
      description: Run interface compliance tests only.
      packageFilters:
        dirExists: test

    # Run tests in specific packages
    test:signaling:
      run: melos exec --fail-fast --scope="ermes_signaling" -- dart test --color
      description: Run tests in ermes_signaling package only.

    test:types:
      run: melos exec --fail-fast --scope="types" -- dart test --color
      description: Run tests in types package only.

    test:testing:
      run: melos exec --fail-fast --scope="ermes_test" -- dart test --color
      description: Run tests in ermes_test package only.

    # Run tests with coverage
    test:coverage:
      run: melos exec --fail-fast -- dart test --coverage=coverage --color
      description: Run tests with coverage collection.
      packageFilters:
        dirExists: test

    # === COVERAGE COMMANDS ===

    # Generate coverage report
    coverage:
      run: |
        echo "📊 Generating code coverage..."
        dart test packages/ermes_test/test/ --coverage=coverage
        echo "🔄 Converting coverage data to LCOV format..."
        dart pub global activate coverage
        dart pub global run coverage:format_coverage --in=coverage --out=coverage/lcov.info --lcov --report-on=packages/ermes_core/lib,packages/ermes_signaling/lib,packages/ermes_cipher/lib
        echo "✅ Coverage report generated at coverage/lcov.info"
      description: Generate code coverage report and save to coverage/lcov.info

    # Show coverage report with details
    coverage:report:
      run: dart run tool/coverage_report.dart --untested
      description: Show detailed coverage report with untested line numbers.

    # Show coverage summary
    coverage:report:summary:
      run: dart run tool/coverage_report.dart
      description: Show coverage summary (without untested line details).

    # Run tests in verbose mode
    test:verbose:
      run: melos exec --fail-fast -- dart test --reporter=expanded --color
      description: Run tests with verbose output.
      packageFilters:
        dirExists: test

    # Run specific test files
    test:file:
      run: melos exec --fail-fast -- dart test --color
      description: Run specific test files. Use with --scope and file path.
      
    # === DEVELOPMENT COMMANDS ===
      
    # Check formatting
    format:check:
      run: melos exec -- dart format --set-exit-if-changed .
      description: Check formatting in all packages.
      
    # Get dependencies for all packages
    get:
      run: melos exec -- dart pub get
      description: Get dependencies for all packages.
      
    # Clean all packages
    clean:
      run: melos exec -- rm -rf build coverage .dart_tool
      description: Clean all packages.
      
    # Generate barrel files for all packages
    barrels:
      run: melos exec --ignore=ermes_test -- dart pub run index_generator
      description: Generate barrel files (indexes) for all packages using index_generator.
      
    # Complete CI pipeline
    ci:
      run: melos clean && melos get && melos analyze && melos format:check && melos test
      description: Run complete CI pipeline (clean, get, analyze, format check, test).
      
    # Quick development check
    check:
      run: melos analyze && melos test:interfaces
      description: Quick check for development (analyze + interface tests).

    diagrams:
      run: diagram_generator --input . --output-dir ./diagrams --prefix ermes --verbose --per-package --no-methods --layout sfdp dot
      description: Generate architecture diagrams for the workspace.

    # Generate diagrams
    diagrams-implements:
      run: diagram_generator --input . --output-dir ./diagrams/implements --prefix ermes --verbose --per-package --no-methods --layout sfdp dot --only-relations implements  
      description: Generate architecture diagrams for the workspace.