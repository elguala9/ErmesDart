name: ermes_dart

packages:
  - packages/**

scripts:
  test:
    run: echo "test"
  
  build:
    description: Run build_runner on all packages
    run: dart run build_runner:build_runner build --release
    exec:
      concurrency: 1
  
  barrel:
    description: Generate barrel files for all packages
    run: dart pub global run barrel_files:barrel_files
    exec:
      concurrency: 1
  
  get:
    description: Get dependencies for all packages
    run: dart pub get
    exec:
      concurrency: 4
  
  analyze:
    description: Analyze all packages
    run: dart analyze
    exec:
      concurrency: 4