name: ermes_dart

packages:
  - packages/**

scripts:
  test:
    run: echo "test"
  
  barrels:
    description: Generate barrel files for all packages
    run: melos exec -- dart pub run index_generator
    exec:
      concurrency: 1
  
  get:
    description: Get dependencies for all packages
    run: dart pub get
    exec:
      concurrency: 4
  
  analyze:
    description: Analyze all packages
    run: dart analyze
    exec:
      concurrency: 4