name: ermes_signaling
description: Signaling layer implementation for Ermes peer-to-peer messaging
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.9.4 <5.0.0"

dependencies:
  meta: ^1.11.0
  barrel_files_annotation: ^0.3.0
  iermes:
    path: ../iermes
  nostr_signaling: ^0.6.0
  cryptdart: ^0.2.0  # Aggiornata alla versione più recente
  stun_shsp: ^0.4.0
  singleton_manager: ^2.2.2

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
  build_runner: ^2.7.1
  index_generator: ^4.1.0
  singleton_manager_generator: ^2.3.2

scripts:
  barrels:
    run: dart run build_runner build --delete-conflicting-outputs

  analyze:
    run: dart analyze

