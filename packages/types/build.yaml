# Build configuration for build_runner

targets:
  $default:
    builders:
      freezed:
        enabled: true
        options:
          # Generate copyWith methods
          copy_with: true
          # Generate equality operators
          equal: true
          # Generate toString methods
          to_string: true
          # Generate map and when methods for unions
          map: true
          # Generate fromJson/toJson methods
          from_json: true
          to_json: true
          
      json_serializable:
        enabled: true
        options:
          # Generate null-safe code
          explicit_to_json: true
          # Include all fields in JSON
          include_if_null: false
          # Use camelCase field names
          field_rename: none
