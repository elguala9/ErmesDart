
name: iermes
description: Interfaces and abstract classes for the Ermes messaging system
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.9.4 <5.0.0"

dependencies:
  meta: ^1.11.0
  barrel_files_annotation: ^0.3.0
  freezed_annotation: ^2.4.1
  shsp_interfaces: ^1.1.0
  callback_handler: ^0.0.3
  cryptdart: ^0.1.3
  shsp_types: ^1.1.0


dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
  build_runner: ^2.4.8
  freezed: ^2.4.7

scripts:
  build:
    run: dart run build_runner:build_runner build --release
  
  barrel:
    run: dart pub global run barrel_files:barrel_files
  
  analyze:
    run: dart analyze