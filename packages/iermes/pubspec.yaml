
name: iermes
description: Interfaces and abstract classes for the Ermes messaging system
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.9.4 <5.0.0"

dependencies:
  meta: ^1.11.0
  stun_shsp: ^0.1.3
  callback_handler: ^0.0.3
  cryptdart: ^0.2.0
  crypto: ^3.0.0
  barrel_files_annotation: ^0.3.0
  convert: ^3.1.0
  json_annotation: ^4.10.0


dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
  build_runner: ^2.7.1
  index_generator: ^4.1.0
  json_serializable: ^6.8.0

scripts:
  barrels:
    run: dart run build_runner build --delete-conflicting-outputs

  analyze:
    run: dart analyze