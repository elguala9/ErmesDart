version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.9.4 <5.0.0"

dependencies:
  iermes:
    path: ../iermes
  ermes_core:
    path: ../ermes_core
  ermes_core_init:
    path: ../ermes_core_init
  ermes_signaling:
    path: ../ermes_signaling
  ermes_cipher:
    path: ../ermes_cipher
  ermes_id_handler:
    path: ../ermes_id_handler
  ermes_message_control:
    path: ../ermes_message_control
  ermes_storage:
    path: ../ermes_storage

  stun_shsp: ^0.2.1
  signaling_contract_sdk: ^2.0.0
  web3dart: ^3.0.1
  wallet: ^0.0.18
  http: ^1.1.0

dev_dependencies:
  lints: ^3.0.0
