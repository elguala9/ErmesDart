
name: ermes_core
description: Implementation of Ermes interfaces for peer-to-peer messaging
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.9.4 <5.0.0"

dependencies:
  meta: ^1.11.0
  barrel_files_annotation: ^0.3.0
  iermes:
    path: ../iermes
  ermes_storage:
    path: ../ermes_storage
  ermes_signaling:
    path: ../ermes_signaling
  # TODO: Find Dart equivalent for 'uuid' package
  # Original uses: uuid: ^13.0.0
  uuid: ^4.5.1
  signaling_contract_sdk: 1.0.2

  shsp_interfaces: ^1.1.0
  shsp_types: ^1.1.0
  shsp_implementations: ^1.1.0
  callback_handler: ^0.0.3
  crypto: ^3.0.3

  # TODO: Find Dart equivalent for 'serialization-utility' package
  # This may need to be custom implemented for Uint8List operations
  
  # TODO: Socket.io support needed for Dart
  # Original uses: socket.io-client: ^4.8.1
  # Consider: socket_io_client for Dart

dev_dependencies:
  lints: ^3.0.0
  build_runner: ^2.7.1
  index_generator: ^4.1.0
  test: ^1.24.0

scripts:
  barrels:
    run: dart run build_runner build --delete-conflicting-outputs

  analyze:
    run: dart analyze
