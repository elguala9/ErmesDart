name: NAT Test (two real NATs in CI)

# Runs BOTH Ermes peers as two parallel GitHub-hosted runners. Each runner
# sits behind Azure NAT, so peer-a <-> peer-b is a genuine NAT <-> NAT
# traversal test over a public Nostr relay + public STUN. The jobs have no
# `needs:` between them, so they start together and overlap in time (the
# rendezvous loop in each binary absorbs the compile-time skew).
#
# Strictness: each binary exits 0 ONLY when every step of its contract
# passes (connect + full message sequence + every ACK). Any missing config,
# failed handshake, malformed message, missing ACK or timeout exits non-zero
# and fails the job. There is no "soft pass".

on:
  workflow_dispatch:
    inputs:
      side:
        description: "Which peer(s) to run on Actions"
        type: choice
        default: a-only
        options:
          - both
          - a-only
          - b-only
      scenario:
        description: "NAT_SCENARIO to run (blank = default plaintext burst)"
        type: string
        default: ""
      timeout_minutes:
        description: "Per-job timeout in minutes (raise for long-outage / peer-restart)"
        type: string
        default: "15"
  push:
    branches: [nat-test]

# Never let two NAT runs of the same ref fight over the shared throwaway
# identities on the relay at the same time.
concurrency:
  group: nat-test-${{ github.ref }}
  cancel-in-progress: true

env:
  # Run JS-based actions (checkout/cache/upload-artifact) on Node.js 24.
  # Node.js 20 is deprecated and forced off on 2026-06-16; this silences the
  # deprecation warning now and is a no-op once Node 24 becomes the default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Public infrastructure — no account, no credit card.
  STUN_HOST: stun.l.google.com
  STUN_PORT: "19302"
  # Several open-write public relays: publishing succeeds if ANY accepts, so a
  # single picky relay no longer fails the rendezvous. relay.damus.io alone
  # rejects anonymous writes ("All relays failed to publish") — keep it only as
  # one of several. Adjust the list if a relay starts requiring NIP-42 AUTH.
  NOSTR_RELAYS: wss://nos.lol,wss://relay.damus.io,wss://nostr-pub.wellorder.net,wss://relay.primal.net
  # Fixed throwaway test identities (NOT real). Both sides must agree on the
  # two public keys; only the private key differs per job. Override the
  # private keys with repo secrets NAT_ALICE_PRIVKEY / NAT_BOB_PRIVKEY if you
  # prefer to keep them out of the workflow file.
  ALICE_PUBKEY: b92ad53e9350444f5572b4ffdc51a9839161729b0f5a62e68a3694c78d3dc4c5
  BOB_PUBKEY: 40f72d5b56f8fcda629d4fd9e046038480cc71aaee01b3a2fc524aba6803dcac

jobs:
  peer-a:
    name: peer-a (initiator)
    # Skipped when pairing peer-a on Actions with a local peer-b.
    # On `push` events the input is empty, so both jobs run as before.
    if: ${{ github.event.inputs.side != 'b-only' }}
    runs-on: ubuntu-latest
    # Overridable via the workflow_dispatch input; '15' on push (input empty).
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout_minutes || '15') }}
    steps:
      - name: Checkout ErmesDart
        uses: actions/checkout@v4
        with:
          path: ErmesDart

      # pubspec.yaml overrides `shsp` with a path to a sibling checkout. The
      # sibling must live next to the main repo so `../SingleHandShakeProtocolDart`
      # resolves. The repo is public, so the default token can clone it.
      - name: Checkout SHSP (shsp path override)
        uses: actions/checkout@v4
        with:
          repository: elguala9/SingleHandshakeProtocolDart
          ref: main
          path: SingleHandShakeProtocolDart

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('ErmesDart/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Resolve dependencies
        working-directory: ErmesDart
        run: dart pub get

      - name: Compile peer A
        working-directory: ErmesDart
        run: >-
          dart compile exe
          packages/ermes_test_docker/bin/nat_peer_a.dart -o peer_a

      - name: Run peer A (initiator)
        working-directory: ErmesDart
        env:
          NOSTR_PRIVKEY: ${{ secrets.NAT_ALICE_PRIVKEY || 'baeed075852a757626e2bae3220c915ec43bcdc81343f83b0f50e3a933063d6c' }}
          NOSTR_PUBKEY: ${{ env.ALICE_PUBKEY }}
          ACCOUNT_ID: ${{ env.ALICE_PUBKEY }}
          # Empty on push events -> default plaintext burst; set by the
          # workflow_dispatch `scenario` input for the encryption scenarios.
          NAT_SCENARIO: ${{ github.event.inputs.scenario }}
        run: |
          set -o pipefail
          ./peer_a 2>&1 | tee peer_a.log

      - name: Upload peer A log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peer-a-log
          path: ErmesDart/peer_a.log
          if-no-files-found: error

  peer-b:
    name: peer-b (responder)
    # Skipped when pairing peer-b on Actions with a local peer-a (use the
    # `side` input). On `push` events the input is empty, so both jobs run.
    if: ${{ github.event.inputs.side != 'a-only' }}
    runs-on: ubuntu-latest
    # Overridable via the workflow_dispatch input; '15' on push (input empty).
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout_minutes || '15') }}
    steps:
      - name: Checkout ErmesDart
        uses: actions/checkout@v4
        with:
          path: ErmesDart

      - name: Checkout SHSP (shsp path override)
        uses: actions/checkout@v4
        with:
          repository: elguala9/SingleHandshakeProtocolDart
          ref: main
          path: SingleHandShakeProtocolDart

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('ErmesDart/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Resolve dependencies
        working-directory: ErmesDart
        run: dart pub get

      - name: Compile peer B
        working-directory: ErmesDart
        run: >-
          dart compile exe
          packages/ermes_test_docker/bin/nat_peer_b.dart -o peer_b

      - name: Run peer B (responder)
        working-directory: ErmesDart
        env:
          NOSTR_PRIVKEY: ${{ secrets.NAT_BOB_PRIVKEY || '187f26af502a4b1dff9c80ab7798ffaace92c3db4ce85301300558ae02a3310e' }}
          NOSTR_PUBKEY: ${{ env.BOB_PUBKEY }}
          ACCOUNT_ID: ${{ env.BOB_PUBKEY }}
          # Empty on push events -> default plaintext burst; set by the
          # workflow_dispatch `scenario` input for the encryption scenarios.
          NAT_SCENARIO: ${{ github.event.inputs.scenario }}
        run: |
          set -o pipefail
          ./peer_b 2>&1 | tee peer_b.log

      - name: Upload peer B log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peer-b-log
          path: ErmesDart/peer_b.log
          if-no-files-found: error
