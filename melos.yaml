name: ermes_dart

packages:
  - packages/**
  - apps/**

command:
  bootstrap:
    environment:
      sdk: ">=3.2.0 <4.0.0"
    
  version:
    # Only allow versioning to happen on main branch.
    branch: main
    # Generate commit links in package changelogs.
    linkToCommits: true
    # Changelog formatting.
    message: "chore(release): publish packages"

scripts:
  # Analyze all packages
  analyze:
    run: melos exec -- dart analyze .
    description: Run Dart analyzer in all packages.
    
  # Format all packages
  format:
    run: melos exec -- dart format .
    description: Format all Dart files.
    
  # Run tests in all packages (default: mock server)
  test:
    run: melos exec --fail-fast -- dart test
    description: Run tests in all packages with mock server.
    packageFilters:
      dirExists: test
      
  # Run tests with mock server (veloce per sviluppo)
  test:mock:
    run: |
      export ERMES_USE_MOCK_SERVER=true
      melos exec --fail-fast -- dart test
    description: Run fast tests with mock server for development.
    packageFilters:
      dirExists: test
      
  # Run tests with real server (completo per CI/CD)
  test:real:
    run: |
      export ERMES_USE_REAL_SERVER=true  
      melos exec --fail-fast -- dart test
    description: Run complete tests with real server for CI/CD.
    packageFilters:
      dirExists: test
    
  # Check formatting
  format:check:
    run: melos exec -- dart format --set-exit-if-changed .
    description: Check formatting in all packages.
    
  # Get dependencies for all packages
  get:
    run: melos exec -- dart pub get
    description: Get dependencies for all packages.
    
  # Clean all packages
  clean:
    run: melos exec -- rm -rf build coverage .dart_tool
    description: Clean all packages.
    
  # Run build_runner in packages that need it
  build:
    run: melos exec -- dart run build_runner build --delete-conflicting-outputs
    description: Run build_runner in all applicable packages.
    packageFilters:
      dependsOn: build_runner
