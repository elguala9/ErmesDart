name: ErmesDart
repository: https://github.com/parresia/ErmesDart

packages:
  - packages/**

scripts:
  # Unit tests
  test:
    description: Run all Dart unit tests (default test command)
    run: dart test packages/ermes_test/test/

  test:unit:
    description: Run all Dart unit tests
    run: dart test packages/ermes_test/test/

  test:unit:watch:
    description: Run Dart unit tests in watch mode
    run: dart test packages/ermes_test/test/ --watch

  # Code quality
  analyze:
    description: Run Dart analyzer on all packages
    run: dart analyze packages/

  format:check:
    description: Check Dart code formatting
    run: dart format --set-exit-if-changed packages/

  format:fix:
    description: Fix Dart code formatting
    run: dart format -w packages/

  # Development
  pub:get:
    description: Run pub get on all packages
    run: melos exec -- dart pub get

  pub:upgrade:
    description: Run pub upgrade on all packages
    run: melos exec -- dart pub upgrade
