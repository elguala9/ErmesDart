name: ErmesDart
repository: https://github.com/parresia/ErmesDart

packages:
  - packages/**

scripts:
  # All Tests
  test:all:
    description: Run all tests (unit + Docker peer) and collect results
    run: |
      echo "🧪 Running all tests..."
      echo ""
      echo "📝 Step 1: Running Dart unit tests..."
      dart test packages/ermes_test/test/ || EXIT_UNIT=$?
      echo ""
      echo "🐳 Step 2: Running Docker peer test..."
      docker compose -f docker-compose-test-peers.yml up --build || EXIT_PEER=$?
      echo ""
      echo "📊 Step 3: Collecting peer test results..."
      bash scripts/collect_peer_test_results.sh || EXIT_RESULTS=$?
      echo ""
      echo "📋 Test Summary:"
      echo "- Unit tests: $([ $EXIT_UNIT -eq 0 ] && echo '✅ PASS' || echo '❌ FAIL')"
      echo "- Peer tests: $([ $EXIT_PEER -eq 0 ] && echo '✅ PASS' || echo '❌ FAIL')"
      echo "- Results collected: $([ $EXIT_RESULTS -eq 0 ] && echo '✅ OK' || echo '⚠️ PARTIAL')"
      echo ""
      if [ -f test_results_summary.json ]; then
        echo "📄 Detailed results in test_results_summary.json"
      fi
      exit $(($EXIT_UNIT + $EXIT_PEER))

  # Docker P2P Peer Tests
  test:peer:docker:
    description: Run 4-peer all-to-all Docker integration test (Alice, Bob, Charlie, Dave)
    run: docker compose -f docker-compose-test-peers.yml up --build
    env:
      TEST_TYPE: docker_peer

  test:peer:docker:clean:
    description: Clean Docker containers, volumes, and networks from peer test
    run: docker compose -f docker-compose-test-peers.yml down -v

  test:peer:docker:logs:
    description: Show Docker logs from peer test containers
    run: docker compose -f docker-compose-test-peers.yml logs -f

  test:peer:docker:status:
    description: Check status of peer test containers
    run: docker compose -f docker-compose-test-peers.yml ps

  test:peer:docker:reset:
    description: Reset peer test (clean + remove all Docker artifacts)
    run: |
      docker compose -f docker-compose-test-peers.yml down -v
      docker system prune -af --volumes

  test:peer:docker:results:
    description: Collect peer test results from docker and create summary
    run: bash scripts/collect_peer_test_results.sh

  test:peer:docker:full:
    description: Run Docker peer test + collect results in one command
    run: |
      echo "🧪 Starting Docker peer test..."
      docker compose -f docker-compose-test-peers.yml up --build
      echo ""
      echo "📊 Collecting results..."
      bash scripts/collect_peer_test_results.sh

  # Unit tests
  test:unit:
    description: Run all Dart unit tests
    run: dart test packages/ermes_test/test/

  test:unit:watch:
    description: Run Dart unit tests in watch mode
    run: dart test packages/ermes_test/test/ --watch

  # Code quality
  analyze:
    description: Run Dart analyzer on all packages
    run: dart analyze packages/

  format:check:
    description: Check Dart code formatting
    run: dart format --set-exit-if-changed packages/

  format:fix:
    description: Fix Dart code formatting
    run: dart format -w packages/

  # Development
  pub:get:
    description: Run pub get on all packages
    run: melos exec -- dart pub get

  pub:upgrade:
    description: Run pub upgrade on all packages
    run: melos exec -- dart pub upgrade
